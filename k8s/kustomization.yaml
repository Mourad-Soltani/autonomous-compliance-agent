apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aca

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - app.yaml
  - hpa.yaml
  - ingress.yaml
  - rbac.yaml

images:
  - name: ghcr.io/mourad-soltani/autonomous-compliance-agent
    newTag: latest

commonLabels:
  app.kubernetes.io/name: autonomous-compliance-agent
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize
