apiVersion: apps/v1
kind: Deployment
metadata:
  name: aca-app
  namespace: aca
  labels:
    app: aca-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aca-app
  template:
    metadata:
      labels:
        app: aca-app
    spec:
      serviceAccountName: aca-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: migrate
          image: ghcr.io/mourad-soltani/autonomous-compliance-agent:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: aca-config
            - secretRef:
                name: aca-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: app
          image: ghcr.io/mourad-soltani/autonomous-compliance-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: aca-config
            - secretRef:
                name: aca-secrets
          volumeMounts:
            - name: exports
              mountPath: /app/exports
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: exports
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aca-app
  namespace: aca
  labels:
    app: aca-app
spec:
  selector:
    app: aca-app
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
