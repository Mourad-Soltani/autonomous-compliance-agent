apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aca-postgres
  namespace: aca
  labels:
    app: aca-postgres
spec:
  serviceName: aca-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aca-postgres
  template:
    metadata:
      labels:
        app: aca-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "compliance"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aca-secrets
                  key: DATABASE_URL
            - name: POSTGRES_DB
              value: "compliance_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - compliance
                - -d
                - compliance_db
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - compliance
                - -d
                - compliance_db
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aca-postgres
  namespace: aca
  labels:
    app: aca-postgres
spec:
  selector:
    app: aca-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
