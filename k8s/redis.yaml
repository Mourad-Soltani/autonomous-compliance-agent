apiVersion: apps/v1
kind: Deployment
metadata:
  name: aca-redis
  namespace: aca
  labels:
    app: aca-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aca-redis
  template:
    metadata:
      labels:
        app: aca-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - "allkeys-lru"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aca-redis
  namespace: aca
  labels:
    app: aca-redis
spec:
  selector:
    app: aca-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
